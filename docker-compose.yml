# Local production-like run:
#   SESSION_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  app:
    build: .
    image: realtime-chat:local
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: '3003'
      DB_PATH: /data/chat.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (at least 32 random characters)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - chat-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  chat-data:
