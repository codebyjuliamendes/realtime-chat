name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:css
      - run: npm run test:e2e

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t realtime-chat:ci .
      - name: Smoke test
        run: |
          docker run -d --name chat -p 3003:3003 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" realtime-chat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3003/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3003/healthz
          curl -fsS http://localhost:3003/ | grep -q NexusChat
          curl -fsS http://localhost:3003/assets/app.css > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:3003/api/session \
            -H 'content-type: application/json' -d '{"username":"ci"}' | jq -r .token)
          curl -fsS http://localhost:3003/api/channels -H "authorization: Bearer $TOKEN" | jq -e '.[0].id == "general"'
          test "$(docker inspect -f '{{.Config.User}}' realtime-chat:ci)" = "node"
      - name: Wait for healthy status
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' chat)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs chat; exit 1
      - name: Graceful shutdown
        run: |
          docker stop -t 15 chat
          test "$(docker inspect -f '{{.State.ExitCode}}' chat)" = "0"
          docker logs chat | grep -q 'shutdown complete'
