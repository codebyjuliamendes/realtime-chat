<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat - Real-Time Enterprise Messenger</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="h-full text-slate-100 flex items-center justify-center overflow-hidden">
  
  <!-- Login Container -->
  <div id="login-container" class="w-full h-full flex items-center justify-center bg-slate-950 relative">
    <!-- Abstract glowing backgrounds -->
    <div class="absolute w-80 h-80 bg-brand-500/10 rounded-full blur-3xl -top-10 -left-10"></div>
    <div class="absolute w-96 h-96 bg-blue-500/10 rounded-full blur-3xl -bottom-10 -right-10"></div>

    <div class="w-full max-w-md p-8 bg-slate-900/60 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-xl text-center z-10 relative">
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-brand-500/10 border border-brand-500/30 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/20">
          <span class="text-3xl">💬</span>
        </div>
      </div>
      <h2 class="text-3xl font-bold tracking-tight mb-2">Welcome to NexusChat</h2>
      <p class="text-slate-400 text-sm mb-8">Enter a username to join the real-time enterprise workspace.</p>
      
      <div class="space-y-4">
        <input type="text" id="username-input" placeholder="Username" autocomplete="off" autofocus
          class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none rounded-xl text-slate-100 font-medium transition duration-200">
        
        <button id="login-btn" 
          class="w-full py-3 bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-brand-600/35">
          Join Channel
        </button>
      </div>
    </div>
  </div>
  
  <!-- Chat App component mount point -->
  <chat-app id="chat-app" class="w-full h-full hidden"></chat-app>

  <script src="components/chat-app.js" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
