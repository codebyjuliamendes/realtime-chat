<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="NexusChat: real-time chat over WebSockets." />
    <title>NexusChat - Real-Time Messenger</title>
    <link rel="stylesheet" href="assets/app.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body class="h-full overflow-hidden">
    <noscript>
      <p class="p-6 text-center">NexusChat needs JavaScript enabled.</p>
    </noscript>

    <!-- Login -->
    <main
      id="login-container"
      class="relative w-full h-full flex items-center justify-center px-4 overflow-hidden"
      hidden
    >
      <div aria-hidden="true" class="absolute w-80 h-80 bg-brand-500/10 rounded-full blur-3xl -top-10 -left-10"></div>
      <div
        aria-hidden="true"
        class="absolute w-96 h-96 bg-blue-500/10 rounded-full blur-3xl -bottom-10 -right-10"
      ></div>

      <div
        class="relative z-10 w-full max-w-md p-6 sm:p-8 bg-slate-900/70 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-xl text-center"
      >
        <div class="flex justify-center mb-6">
          <div
            class="w-16 h-16 bg-brand-500/10 border border-brand-500/30 rounded-2xl flex items-center justify-center text-brand-500"
          >
            <span data-icon="message" data-class="w-8 h-8"></span>
          </div>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">Welcome to NexusChat</h1>
        <p class="text-slate-400 text-sm mb-8">Choose a display name to join the workspace.</p>

        <form id="login-form" class="space-y-4 text-left" novalidate>
          <div>
            <label for="username-input" class="block text-sm font-medium text-slate-300 mb-1">Display name</label>
            <input
              type="text"
              id="username-input"
              name="username"
              maxlength="32"
              required
              autocomplete="nickname"
              aria-describedby="login-error"
              class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700 focus:border-brand-500 rounded-xl text-slate-100 font-medium transition"
            />
          </div>
          <p id="login-error" class="min-h-[1.25rem] text-sm text-red-400" role="alert"></p>
          <button
            id="login-btn"
            type="submit"
            class="w-full py-3 bg-brand-600 hover:bg-brand-500 active:bg-brand-700 disabled:opacity-60 disabled:cursor-wait text-white font-semibold rounded-xl transition shadow-lg shadow-brand-600/30"
          >
            Join workspace
          </button>
        </form>
        <p class="mt-6 text-xs text-slate-500">
          No password: your session is stored in this browser. Signing out removes it from this device.
        </p>
      </div>
    </main>

    <!-- Chat application (rendered in the light DOM so Tailwind classes apply) -->
    <chat-app id="chat-app" class="block w-full h-full" hidden></chat-app>

    <div
      id="toast-container"
      class="fixed top-4 right-4 left-4 sm:left-auto flex flex-col items-end gap-2 z-[100]"
      aria-live="polite"
    ></div>
  </body>
</html>
