apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime-chat-ingress
  namespace: default
  annotations:
    # WebSockets are long-lived: keep idle connections open well beyond the 30s heartbeat.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  # Add a tls: section (e.g. with cert-manager) so the app is served over https/wss.
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realtime-chat-service
                port:
                  number: 80
